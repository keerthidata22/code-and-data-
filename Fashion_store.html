<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .dress {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 250px;
        }
        .dress img {
            width: 100%;
            border-radius: 10px;
        }
        .dress h3 {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://img.freepik.com/premium-vector/beauty-hand-drawn-clothing-store-logo-boutique_637057-213.jpg?semt=ais_hybrid&w=740" alt="Fashion Store Logo" class="logo">
        Fashion Store
    </header>
    <div class="container">
        <div class="dress">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMpL1v8BsM050HOy4BRAc4kRZ3sjkX11pPIA&s" alt="Dress 1">
            <h3>Elegant Evening Gown</h3>
            <p>INR 4000</p>
        </div>
        <div class="dress">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSB-T13Om_uP5tYO4_1YqrcNJEcmY14aByvUQ&s" alt="Dress 2">
            <h3>Casual Summer Dress</h3>
            <p>INR 1000</p>
        </div>
        <div class="dress">
            <img src="https://img.freepik.com/free-photo/sad-girl-rocks_1122-436.jpg?ga=GA1.1.758023469.1744531284&semt=ais_hybrid&w=740" alt="Dress 3">
            <h3>Floral Maxi Dress</h3>
            <p>INR 3000</p>
        </div>
    </div>
</body>
</html>
